[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show verbose output
addopts =
    -v
    --tb=short
    --strict-markers

# Markers for organizing tests
markers =
    integration: Integration tests that require test data
    slow: Slow-running tests (e.g., processing large ZIP files)
