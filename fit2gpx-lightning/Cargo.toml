[package]
name = "fit2gpx-lightning"
version = "0.1.2"
edition = "2024"
authors = ["Bobby bobby060"]
description = "Fast FIT to GPX converter with Python bindings - drop-in replacement for fit2gpx"
license = "MIT"
repository = "https://github.com/yourusername/fit2gpx-lightning"
keywords = ["fit", "gpx", "garmin", "strava", "conversion"]
categories = ["command-line-utilities", "parsing"]
readme = "../README.md"

[lib]
name = "fit2gpx_lightning"
crate-type = ["cdylib", "rlib"]

[dependencies]
fit2gpx = "0.6"
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.8"
zip = "0.6"
flate2 = "1.0"
tempfile = "3.8"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.38"
chrono = "0.4"
fitparser = "0.5"
indicatif = { version = "0.17", features = ["rayon"], optional = true }
pyo3 = { version = "0.22", features = ["extension-module", "anyhow", "abi3-py38"], optional = true }

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.0"

[build-dependencies]
pyo3-build-config = "0.22"

[features]
default = ["progress", "python"]
progress = ["indicatif"]
python = ["pyo3"]