name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
  release:
    types: [published]

jobs:
  # Job 1: Lint and Test
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all-features
        working-directory: fit2gpx-lightning
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - name: Run tests (no default features)
        run: cargo test --no-default-features
        working-directory: fit2gpx-lightning
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - name: Check formatting
        run: cargo fmt -- --check
        working-directory: fit2gpx-lightning
        if: matrix.os == 'ubuntu-latest'

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
        working-directory: fit2gpx-lightning
        if: matrix.os == 'ubuntu-latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pytest maturin

      - name: Build Python package
        run: maturin develop --release --features python
        working-directory: fit2gpx-lightning
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - name: Run Python tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  # Job 2: Build Python wheels
  build-wheels:
    name: Build wheels on ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    needs: test
    if: github.event_name == 'release'
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-13  # Intel
            target: x86_64
          - os: macos-14  # Apple Silicon
            target: aarch64
          - os: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels (maturin)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --features python
          sccache: 'true'
          manylinux: auto
          working-directory: fit2gpx-lightning

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: fit2gpx-lightning/dist

  # Job 3: Publish to PyPI
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*
